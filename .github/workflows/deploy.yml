name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Allow one concurrent deployment; newer pushes cancel in-progress runs.
concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      # Copy only what the site serves, rather than publishing the whole repo. An
      # allowlist means new test or tooling files never leak into the deploy by
      # default. CNAME has to come along or the custom domain is dropped.
      - name: Assemble the site
        run: |
          set -euo pipefail
          VERSION="${GITHUB_SHA::7}"
          mkdir -p _site
          cp -r index.html version.json manifest.webmanifest sw.js CNAME assets _site/
          sed -i "s/__APP_VERSION__/${VERSION}/g" _site/index.html _site/version.json
          echo "Stamped version ${VERSION}"

      # Catches a stamping step that silently stopped replacing the placeholder.
      # Scoped to the two stamped files on purpose: app.js compares against the literal
      # "__APP_VERSION__" to detect a local build, so a whole-tree grep always matches.
      - name: Check the build was stamped
        run: |
          if grep -q "__APP_VERSION__" _site/index.html _site/version.json; then
            echo "::error::__APP_VERSION__ was not replaced; the app would report an unstamped build and skip update checks"
            exit 1
          fi

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

      - id: deployment
        uses: actions/deploy-pages@v4
